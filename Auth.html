<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="RepairLink — Local Repair Experts">
<meta property="og:description" content="Mapping North Delhi's kaarigars — repair first, recycle what's left. Find your nearest cobbler, mechanic, and repair shops instantly.">
<meta property="og:image" content="https://repairlink-de1ta.web.app/logo.png">
<meta property="og:url" content="https://repairlink-de1ta.web.app/">
<meta name="twitter:card" content="summary_large_image">
<title>Sign In — RepairLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { 
    display: flex; align-items: center; justify-content: center; 
    min-height: 100vh; overflow: hidden; position: relative;
    font-family: 'Manrope', sans-serif;
  }
  .auth-container {
    max-width: 440px; width: 100%; text-align: center;
    border-radius: 24px; padding: 48px 40px; margin: 20px;
  }
  .logo { display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; color: var(--ink); margin-bottom: 24px; }
  .logo-leaf { color: var(--leaf); }
  .auth-title { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }
  .auth-subtitle { font-size: 15px; color: var(--ink-dim); line-height: 1.6; margin-bottom: 32px; padding: 0 20px; }
  
  .google-btn { 
    display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px 20px; 
    background: #fff; border: 1px solid var(--line); border-radius: 999px; font-family: 'Manrope', sans-serif; 
    font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(34,29,20,0.05);
  }
  .google-btn:hover { background: var(--paper-2); transform: translateY(-1px); box-shadow: 0 8px 16px rgba(34,29,20,0.08); }
  .google-btn img { width: 20px; height: 20px; }

  .role-option {
    display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s;
  }
  .role-option:hover { border-color: var(--ink); background: var(--paper-2); }
  .role-option input { display: none; }
  .role-option.selected { border-color: var(--marigold); background: var(--marigold-dim); }
  .role-title { font-weight: 700; font-size: 15px; color: var(--ink); }
  .role-desc { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }
  
  .btn-submit { 
    width: 100%; padding: 14px 20px; background: var(--ink); color: #fff; border: none; border-radius: 999px; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; margin-top: 12px; 
  }
  .btn-submit:hover { background: #000; transform: translateY(-1px); }

  #errorMessage { color: #d32f2f; font-size: 13px; margin-top: 16px; display: none; }
</style>
<link rel="icon" type="image/png" href="logo.png?v=2">
<link rel="shortcut icon" type="image/png" href="logo.png?v=2">
</head>
<body class="mesh-bg">

<div class="auth-container glass-card fade-in-up" id="authStep1">
  <div class="logo">
    <img src="logo.png" style="width: 32px; height: 32px; object-fit: contain;">
    RepairLink<span class="logo-leaf">.</span>
  </div>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-subtitle">Sign in to find kaarigars near you or manage your repair shop profile.</p>
  
  <button class="google-btn" id="googleSignInBtn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    Continue with Google
  </button>
  <div id="errorMessage"></div>
</div>

<div class="auth-container glass-card fade-in-up" id="authStep2" style="display: none;">
  <div class="logo">
    <img src="logo.png" style="width: 32px; height: 32px; object-fit: contain;">
    RepairLink<span class="logo-leaf">.</span>
  </div>
  <h1 class="auth-title">Choose your role</h1>
  <p class="auth-subtitle">It looks like you're new here! How do you want to use RepairLink?</p>
  
  <div id="roleSelection" style="display: block;">
    <label class="role-option selected" id="optUser">
      <input type="radio" name="role" value="user" checked>
      <div>
        <div class="role-title">I am a Customer</div>
        <div class="role-desc">I want to find kaarigars to repair my items.</div>
      </div>
    </label>
    
    <label class="role-option" id="optKaarigar">
      <input type="radio" name="role" value="kaarigar">
      <div>
        <div class="role-title">I am a Kaarigar</div>
        <div class="role-desc">I want to list my repair shop and manage jobs.</div>
      </div>
    </label>
    
    <button class="btn-submit" id="completeSignupBtn">Complete Signup</button>
  </div>
</div>

<script type="module" src="auth.js?v=8"></script>
<script>
  function selectRole(selectedId) {
    document.getElementById('optUser').classList.remove('selected');
    document.getElementById('optKaarigar').classList.remove('selected');
    
    document.getElementById(selectedId).classList.add('selected');
    document.getElementById(selectedId).querySelector('input').checked = true;
  }

  document.getElementById('optUser').addEventListener('click', () => selectRole('optUser'));
  document.getElementById('optKaarigar').addEventListener('click', () => selectRole('optKaarigar'));
</script>

<!-- Return to Home Draggable Button -->
<a href="index.html" class="return-home-btn" id="returnHomeBtn" style="position:fixed; bottom:100px; left:30px; z-index:9999; display:flex; align-items:center; gap:8px; background:var(--ink, #1F1B13); color:#fff; padding:12px 20px; border-radius:99px; text-decoration:none; font-weight:700; font-family:'Manrope', sans-serif; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,0.15); cursor:grab; user-select:none; transition: transform 0.3s, box-shadow 0.3s;">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  <span>Return to Home</span>
</a>
<script>
  (function(){
    const btn = document.getElementById('returnHomeBtn');
    if(!btn) return;
    let isDragging = false, hasDragged = false, offsetX, offsetY;

    const dragStart = (e) => {
      isDragging = true;
      hasDragged = false;
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      offsetX = clientX - btn.getBoundingClientRect().left;
      offsetY = clientY - btn.getBoundingClientRect().top;
      btn.style.cursor = 'grabbing';
      btn.style.transition = 'none';
    };

    const drag = (e) => {
      if (!isDragging) return;
      hasDragged = true;
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      btn.style.left = (clientX - offsetX) + 'px';
      btn.style.top = (clientY - offsetY) + 'px';
      btn.style.bottom = 'auto';
      btn.style.right = 'auto';
    };

    const dragEnd = (e) => {
      if (!isDragging) return;
      isDragging = false;
      btn.style.cursor = 'grab';
      btn.style.transition = 'transform 0.3s, box-shadow 0.3s';
    };

    btn.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);
    btn.addEventListener('click', (e) => { if(hasDragged) e.preventDefault(); });
    btn.addEventListener('touchstart', dragStart, {passive: true});
    document.addEventListener('touchmove', drag, {passive: false});
    document.addEventListener('touchend', dragEnd);
  })();
</script>
<!-- PAGE TRACKER SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  import { firebaseConfig } from './env.js';

  const app = initializeApp(firebaseConfig, "TrackerApp-" + Math.random().toString(36).substring(7));
  const db = getFirestore(app);

  let pageName = window.location.pathname.split('/').pop();
  if (!pageName || pageName === '') pageName = 'index.html';
  const docRef = doc(db, 'stats', 'page_visits');
  setDoc(docRef, { [pageName]: increment(1) }, { merge: true }).catch(e => console.error("Error tracking visit:", e));
</script>
</body>

</html>
