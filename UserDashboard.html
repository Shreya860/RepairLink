<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — RepairLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
  .container { max-width: 800px; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(34,29,20,0.12); margin-top: 20px; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; margin-bottom: 24px; color: var(--ink); }
  
  .profile-section { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .profile-pic { width: 80px; height: 80px; border-radius: 50%; background: var(--paper-2); display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: 700; color: var(--ink-dim); border: 1px solid var(--line); object-fit: cover; }
  .profile-info { flex: 1; }
  .profile-name { font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .profile-email { font-size: 14px; color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }
  
  .section-title { font-family: 'Fraunces', serif; font-size: 20px; margin-bottom: 16px; color: var(--ink); margin-top: 30px; }
  
  .list-container { display: flex; flex-direction: column; gap: 12px; }
  .list-item { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--line); padding: 16px; border-radius: 12px; }
  .list-info { display: flex; flex-direction: column; gap: 4px; }
  .list-title { font-weight: 700; font-size: 15px; color: var(--ink); }
  .list-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-dim); }
  .status-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .status-badge.contacted { background: #E3F2FD; color: #1565C0; }
  .status-badge.completed { background: var(--leaf-dim); color: #1F7A44; }
</style>
</head>
<body>

<header style="position: relative; padding: 0; align-items: center; justify-content: center; margin-bottom: 30px;">
  <div class="brand" style="pointer-events: auto;">
    <div class="brand-mark">
      <svg class="stitch" width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M2 12h3M7 12h3M12 12h3M17 12h3" stroke="#FFB800" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.5 5"/>
        <circle cx="12" cy="12" r="9" stroke="#FF4C3B" stroke-width="1.4" opacity="0.55"/>
      </svg>
      <h1 style="margin:0; font-size: 21px;">RepairLink</h1>
    </div>
    <nav style="margin-top: 12px; display: flex; gap: 15px; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700;">
      <a href="RepairLink.html" style="color: var(--ink); text-decoration: none;">Home</a>
      <a href="AboutUs.html" style="color: var(--ink); text-decoration: none;">About Us</a>
      <a href="UserDashboard.html" id="navDashboard" style="color: var(--leaf); text-decoration: none;">Dashboard</a>
      <a href="Contact.html" style="color: var(--ink); text-decoration: none;">Contact</a>
      <a href="#" id="navLogout" style="color: var(--ink-dim); text-decoration: none; display: none;">Logout</a>
    </nav>
  </div>
</header>

<div class="container" id="userContainer" style="display:none;">
  <h1>My Dashboard</h1>
  
  <div class="profile-section">
    <img id="profilePic" src="" alt="Profile Picture" class="profile-pic" style="display:none;">
    <div id="profileInitials" class="profile-pic">?</div>
    <div class="profile-info">
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="profile-email" id="profileEmail"></div>
    </div>
  </div>

  <h2 class="section-title">Saved Kaarigars</h2>
  <div class="list-container">
    <div class="list-item">
      <div class="list-info">
        <div class="list-title">Raju Cobbler</div>
        <div class="list-meta">Kamla Nagar • Cobbler</div>
      </div>
      <div class="status-badge contacted">Contacted</div>
    </div>
    <div class="list-item">
      <div class="list-info">
        <div class="list-title">Timepiece Experts</div>
        <div class="list-meta">Model Town • Watch Repairer</div>
      </div>
      <div class="status-badge contacted">Saved</div>
    </div>
  </div>

  <h2 class="section-title">Recent Repairs</h2>
  <div class="list-container">
    <div class="list-item">
      <div class="list-info">
        <div class="list-title">Leather Bag Stitching</div>
        <div class="list-meta">Oct 12, 2026 • 450 INR</div>
      </div>
      <div class="status-badge completed">Completed</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    projectId: "repairlink-de1ta",
    appId: "1:4711329582:web:6e12287963fd4bd58254bf",
    storageBucket: "repairlink-de1ta.firebasestorage.app",
    apiKey: "AIzaSyDMuvy1qfYvqLP348TZB-lfxGixaJGZFrk",
    authDomain: "repairlink-de1ta.firebaseapp.com",
    messagingSenderId: "4711329582",
    measurementId: "G-BQ7PBRSGH3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'Auth.html';
      return;
    }
    
    document.getElementById('navLogout').style.display = 'inline-block';
    
    // Check role
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (userDoc.exists()) {
      const role = userDoc.data().role;
      if (role === 'user' || role === 'admin') {
        document.getElementById('userContainer').style.display = 'block';
        
        // Populate profile
        const data = userDoc.data();
        document.getElementById('profileName').textContent = data.displayName || 'Customer';
        document.getElementById('profileEmail').textContent = data.email;
        
        if (data.photoURL) {
          document.getElementById('profilePic').src = data.photoURL;
          document.getElementById('profilePic').style.display = 'block';
          document.getElementById('profileInitials').style.display = 'none';
        } else {
          document.getElementById('profileInitials').textContent = (data.displayName || '?').charAt(0).toUpperCase();
        }
        
      } else {
        alert("You are registered as a Kaarigar. Redirecting to your dashboard.");
        window.location.href = 'KaarigarDashboard.html';
      }
    } else {
      window.location.href = 'Auth.html';
    }
  });

  document.getElementById('navLogout').addEventListener('click', (e) => {
    e.preventDefault();
    signOut(auth).then(() => {
      window.location.href = 'RepairLink.html';
    });
  });
</script>
</body>
</html>
