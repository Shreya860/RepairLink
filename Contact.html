<style>

<div class="container glass-card fade-in-up">
  <h1>Get in Touch</h1>
  <p class="sub">Have a question or need to report an issue? Send us a message and our team will get back to you shortly.</p>
  
  <div id="successState" style="display:none; text-align:center; padding: 40px 20px;">
    <div style="width: 60px; height: 60px; border-radius: 30px; background: var(--leaf-dim); color: var(--leaf); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h2 style="font-family:'Fraunces', serif; font-size:24px; color:var(--ink); margin-bottom:12px;">Message Sent!</h2>
    <p style="color:var(--ink-dim); font-size:14px; margin-bottom:24px;">Thank you for getting in touch. Our team will review your message and reach out shortly.</p>
    <button onclick="window.location.href='RepairLink.html'" class="submit-btn" style="width:auto; margin:0 auto; padding: 12px 24px;">Return Home</button>
  </div>

  <form id="contactForm">
    <div class="field-group">
      <label>Your Name</label>
      <input type="text" id="contactName" placeholder="e.g. Ramesh Kumar" required>
    </div>
    <div class="field-group">
      <label>Phone or Email</label>
      <input type="text" id="contactContact" placeholder="How can we reach you?" required>
    </div>
    <div class="field-group">
      <label>Message</label>
      <textarea id="contactMessage" placeholder="Tell us how we can help..." required></textarea>
    </div>
    <button type="submit" id="submitBtn" class="submit-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      Send Message
    </button>
  </form>
</div>

<script type="module">
  window.showToast = function(message, type = 'success') {
    let toast = document.getElementById('globalToast');
    if(!toast) {
      toast = document.createElement('div');
      toast.id = 'globalToast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
    toast.innerHTML = `<span class="toast-icon">${icon}</span> ${message}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    projectId: "repairlink-de1ta",
    appId: "1:4711329582:web:6e12287963fd4bd58254bf",
    storageBucket: "repairlink-de1ta.firebasestorage.app",
    apiKey: "AIzaSyAcLvXeMUA01CB1vha8I6_R0iFK5iN0RWU",
    authDomain: "repairlink-de1ta.firebaseapp.com",
    messagingSenderId: "4711329582",
    measurementId: "G-BQ7PBRSGH3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = `<div class="spinner"></div> Sending...`;
    btn.disabled = true;

    try {
      await addDoc(collection(db, "messages"), {
        name: document.getElementById('contactName').value,
        contactInfo: document.getElementById('contactContact').value,
        message: document.getElementById('contactMessage').value,
        createdAt: serverTimestamp(),
        status: 'unread'
      });

      document.getElementById('contactForm').style.display = 'none';
      document.getElementById('successState').style.display = 'block';

    } catch (err) {
      console.error(err);
      showToast("Failed to send message: " + err.message, 'error');
      btn.innerHTML = originalText;
      btn.disabled = false;
    }
  });
</script>


<!-- Return to Home Draggable Button -->
<a href="index.html" class="return-home-btn" id="returnHomeBtn" style="position:fixed; bottom:100px; left:30px; z-index:9999; display:flex; align-items:center; gap:8px; background:var(--ink, #1F1B13); color:#fff; padding:12px 20px; border-radius:99px; text-decoration:none; font-weight:700; font-family:'Manrope', sans-serif; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,0.15); cursor:grab; user-select:none; transition: transform 0.3s, box-shadow 0.3s;">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  <span>Return to Home</span>
</a>
<script>
  (function(){
    const btn = document.getElementById('returnHomeBtn');
    if(!btn) return;
    let isDragging = false, hasDragged = false, offsetX, offsetY;

    const dragStart = (e) => {
      isDragging = true;
      hasDragged = false;
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      offsetX = clientX - btn.getBoundingClientRect().left;
      offsetY = clientY - btn.getBoundingClientRect().top;
      btn.style.cursor = 'grabbing';
      btn.style.transition = 'none';
    };

    const drag = (e) => {
      if (!isDragging) return;
      hasDragged = true;
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      btn.style.left = (clientX - offsetX) + 'px';
      btn.style.top = (clientY - offsetY) + 'px';
      btn.style.bottom = 'auto';
      btn.style.right = 'auto';
    };

    const dragEnd = (e) => {
      if (!isDragging) return;
      isDragging = false;
      btn.style.cursor = 'grab';
      btn.style.transition = 'transform 0.3s, box-shadow 0.3s';
    };

    btn.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);
    btn.addEventListener('click', (e) => { if(hasDragged) e.preventDefault(); });
    btn.addEventListener('touchstart', dragStart, {passive: true});
    document.addEventListener('touchmove', drag, {passive: false});
    document.addEventListener('touchend', dragEnd);
  })();
</script>
<!-- PAGE TRACKER SCRIPT -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, doc, setDoc, increment } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    projectId: "repairlink-de1ta",
    appId: "1:4711329582:web:6e12287963fd4bd58254bf",
    storageBucket: "repairlink-de1ta.firebasestorage.app",
    apiKey: "AIzaSyAcLvXeMUA01CB1vha8I6_R0iFK5iN0RWU",
    authDomain: "repairlink-de1ta.firebaseapp.com",
    messagingSenderId: "4711329582",
    measurementId: "G-BQ7PBRSGH3"
  };

  const app = initializeApp(firebaseConfig, "TrackerApp-" + Math.random().toString(36).substring(7));
  const db = getFirestore(app);

  let pageName = window.location.pathname.split('/').pop();
  if (!pageName || pageName === '') pageName = 'index.html';
  const docRef = doc(db, 'stats', 'page_visits');
  setDoc(docRef, { [pageName]: increment(1) }, { merge: true }).catch(e => console.error("Error tracking visit:", e));
</script>
