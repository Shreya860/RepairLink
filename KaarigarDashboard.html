<style>
  body { overflow: auto; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
  .container { max-width: 800px; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(34,29,20,0.12); margin-top: 20px; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; margin-bottom: 24px; color: var(--ink); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 30px; }
  .stat-card { background: var(--paper-2); border: 1px solid var(--line); border-radius: 14px; padding: 20px; text-align: center; }
  .stat-card-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 8px; }
  .stat-card-value { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; color: var(--ink); }
  
  .job-list { display: flex; flex-direction: column; gap: 12px; }
  .job-item { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--line); padding: 16px; border-radius: 12px; }
  .job-info { display: flex; flex-direction: column; gap: 4px; }
  .job-title { font-weight: 700; font-size: 15px; color: var(--ink); }
  .job-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-dim); }
  .job-status { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--marigold-dim); color: #8A5C00; }
  .job-status.done { background: var(--leaf-dim); color: #1F7A44; }
  
  .profile-status { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; margin-bottom: 20px; padding: 12px; border-radius: 8px; }
  .status-pending { background: var(--marigold-dim); color: #8A5C00; border: 1px solid #FFD54F; }
  .status-live { background: var(--leaf-dim); color: #1F7A44; border: 1px solid #81C784; }
  .status-incomplete { background: #f5f5f5; color: var(--ink-dim); border: 1px solid var(--line); }
  
  .form-group { margin-bottom: 16px; width: 100%; text-align: left; }
  .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-family: 'Manrope', sans-serif; font-size: 14px; background: var(--paper-2); color: var(--ink); box-sizing: border-box; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  
  .btn { padding: 12px 20px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; font-size: 14px; display: inline-flex; justify-content: center; align-items: center; }
  .btn-primary { background: var(--marigold); color: #2A1E00; }
  .btn-primary:hover { background: #ffc935; }
  .btn-secondary { background: var(--paper-2); color: var(--ink); border: 1px solid var(--line); }
  .btn-secondary:hover { background: #e0e0e0; }
  
  .preview-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; text-align: left; margin-bottom: 20px; }
  .preview-card h3 { margin: 0 0 4px 0; font-family: 'Fraunces', serif; font-size: 20px; color: var(--ink); }
  .preview-meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-dim); margin-bottom: 12px; }
  .preview-intro { font-size: 14px; color: var(--ink); line-height: 1.5; margin-bottom: 16px; }
</style>

  <!-- Profile Form View -->

  <!-- Profile Preview View -->

  <div class="stat-grid" id="statsGrid" style="display:none;">

    </div>
    <div class="stat-card">
      <div class="stat-card-label">Active Requests</div>

  <div id="activeJobsSection" style="display:none; margin-top:40px;">
    <h2 style="font-family:'Fraunces', serif; font-size: 20px; margin-bottom: 16px;">Active Jobs</h2>

<script type="module">
  window.showToast = function(message, type = 'success') {
    let toast = document.getElementById('globalToast');
    if(!toast) {
      toast = document.createElement('div');
      toast.id = 'globalToast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
    toast.innerHTML = `<span class="toast-icon">${icon}</span> ${message}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  };

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-storage.js";

  const firebaseConfig = {
    projectId: "repairlink-de1ta",
    appId: "1:4711329582:web:6e12287963fd4bd58254bf",
    storageBucket: "repairlink-de1ta.firebasestorage.app",
    apiKey: "AIzaSyDMuvy1qfYvqLP348TZB-lfxGixaJGZFrk",
    authDomain: "repairlink-de1ta.firebaseapp.com",
    messagingSenderId: "4711329582",
    measurementId: "G-BQ7PBRSGH3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let currentKaarigarData = null;
  let currentUser = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'Auth.html';
      return;
    }
    
    currentUser = user;
    
    // Check role
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (userDoc.exists()) {
      const role = userDoc.data().role;
      if (role !== 'admin' && role !== 'kaarigar') {
        alert("You do not have access to the Kaarigar Dashboard.");
        window.location.href = 'RepairLink.html';
      } else {
        document.getElementById('dashboardContainer').style.display = 'flex';
        loadKaarigarProfile();
      }
    } else {
      window.location.href = 'Auth.html';
    }
  });

  async function loadKaarigarProfile() {
    try {
      const kDoc = await getDoc(doc(db, 'kaarigars', currentUser.uid));
      if (kDoc.exists()) {
        currentKaarigarData = kDoc.data();
        
        // Populate form fields
        document.getElementById('kName').value = currentKaarigarData.name || '';
        document.getElementById('kTrade').value = currentKaarigarData.trade || 'cobbler';
        document.getElementById('kArea').value = currentKaarigarData.area || '';
        document.getElementById('kYears').value = currentKaarigarData.years || '';
        document.getElementById('kIntro').value = currentKaarigarData.intro || '';
        
        const statusBanner = document.getElementById('profileStatusBanner');
        if (currentKaarigarData.verified) {
          statusBanner.textContent = "Profile Status: Approved & Live";
          statusBanner.className = "profile-status status-live";
          document.getElementById('profileFormView').style.display = 'none';
          document.getElementById('profilePreviewView').style.display = 'none';
          
          document.getElementById('statAvgRating').textContent = (currentKaarigarData.avgRating || '0.0') + ' ★';
          document.getElementById('statTotalRatings').textContent = (currentKaarigarData.totalRatings || 0) + ' reviews';
          
          document.getElementById('statsGrid').style.display = 'grid';
          document.getElementById('activeJobsSection').style.display = 'block';
          loadActiveJobs();
        } else {
          statusBanner.textContent = "Profile Status: Pending Admin Approval";
          statusBanner.className = "profile-status status-pending";
          document.getElementById('profileFormView').style.display = 'block';
        }
      } else {
        // No profile exists yet
        const statusBanner = document.getElementById('profileStatusBanner');
        statusBanner.textContent = "Profile Status: Incomplete (Please fill out details below)";
        statusBanner.className = "profile-status status-incomplete";
        document.getElementById('profileFormView').style.display = 'block';
      }
    } catch(err) {
      console.error(err);
    }
  }

  // Navigation Logic
  document.getElementById('btnPreview').addEventListener('click', () => {
    // Populate preview
    document.getElementById('prevName').textContent = document.getElementById('kName').value || 'Unknown';
    
    const tradeMap = { 'cobbler': 'Cobbler', 'watch': 'Watch Repairer', 'appliance': 'Appliance Repairer', 'locksmith': 'Locksmith' };
    document.getElementById('prevTrade').textContent = tradeMap[document.getElementById('kTrade').value];
    
    document.getElementById('prevArea').textContent = document.getElementById('kArea').value || 'Unknown Area';
    document.getElementById('prevYears').textContent = document.getElementById('kYears').value || '0';
    document.getElementById('prevIntro').textContent = document.getElementById('kIntro').value || 'No intro provided.';
    
    document.getElementById('profileFormView').style.display = 'none';
    document.getElementById('profilePreviewView').style.display = 'block';
  });

  document.getElementById('btnEdit').addEventListener('click', () => {
    document.getElementById('profileFormView').style.display = 'block';
    document.getElementById('profilePreviewView').style.display = 'none';
  });

  document.getElementById('btnSubmit').addEventListener('click', async () => {
    const btn = document.getElementById('btnSubmit');
    const name = document.getElementById('kName').value;
    const trade = document.getElementById('kTrade').value;
    const area = document.getElementById('kArea').value;
    
    if (!name || !trade || !area) {
      showToast("Please fill in Name, Trade, and Area.", 'error');
      return;
    }
    
    btn.innerHTML = `<div class="spinner"></div> Submitting...`;
    btn.disabled = true;
    
    const kData = {
      name: document.getElementById('kName').value,
      trade: document.getElementById('kTrade').value,
      area: document.getElementById('kArea').value,
      years: parseInt(document.getElementById('kYears').value) || 0,
      intro: document.getElementById('kIntro').value,
      verified: false,
      uid: currentUser.uid,
      lat: 28.68, // Default approx lat for North Delhi for now
      lng: 77.20  // Default approx lng
    };
    
    try {
      await setDoc(doc(db, 'kaarigars', currentUser.uid), kData, { merge: true });
      showToast("Profile submitted! An admin will review it shortly.");
      loadKaarigarProfile(); // Reloads and resets UI to Pending state
      
      document.getElementById('profilePreviewView').style.display = 'none';
    } catch(err) {
      console.error(err);
      showToast("Error saving profile: " + err.message, 'error');
    } finally {
      btn.innerHTML = 'Final Submit';
      btn.disabled = false;
    }
  });

  async function loadActiveJobs() {
    const jobList = document.querySelector('#activeJobsSection .job-list');
    jobList.innerHTML = '<div style="text-align:center; padding:20px; color:var(--ink-dim);">Loading active jobs...</div>';
    
    try {
      const q = query(collection(db, "orders"), where("kaarigarId", "==", currentUser.uid));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        jobList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></div>
            <h3>No jobs assigned</h3>
            <p>You don't have any repairs right now. Once an admin assigns a repair to you, it will appear here.</p>
          </div>
        `;
        return;
      }

      jobList.innerHTML = '';
      
      let activeCount = 0;
      let doneCount = 0;
      
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        if (data.status === 'done') {
           doneCount++;
        } else {
           activeCount++;
        }
        const dateStr = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString() : 'Just now';
        
        const jobHTML = `
          <div class="job-item" style="flex-direction:column; align-items:stretch; gap:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="job-info">
                <div class="job-title">${data.item}</div>
                <div class="job-meta">${dateStr} • ${data.address}</div>
              </div>
              <select class="job-status" data-id="${docSnap.id}" style="border:none; outline:none; font-family:'JetBrains Mono', monospace;" onchange="updateJobStatus(this)">
                <option value="pending" ${data.status==='pending'?'selected':''}>Picked Up</option>
                <option value="progress" ${data.status==='progress'?'selected':''}>Repairing</option>
                <option value="ready" ${data.status==='ready'?'selected':''}>Ready to Drop</option>
                <option value="done" ${data.status==='done'?'selected':''}>Delivered</option>
              </select>
            </div>
            
            <!-- Trust Infrastructure: Before/After Photos -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; background:var(--paper-2); padding:16px; border-radius:8px;">
              <div>
                <div style="font-size:12px; font-weight:700; margin-bottom:8px;">BEFORE REPAIR</div>
                <label style="border:1px dashed var(--line); height:80px; border-radius:6px; display:flex; justify-content:center; align-items:center; color:var(--ink-dim); font-size:12px; cursor:pointer; background:${data.beforePhotoUrl ? 'url('+data.beforePhotoUrl+') center/cover' : '#fff'};">
                  ${data.beforePhotoUrl ? '' : '+ Upload Photo'}
                  <input type="file" style="display:none;" onchange="uploadPhoto(this, 'before', '${docSnap.id}')" accept="image/*">
                </label>
              </div>
              <div>
                <div style="font-size:12px; font-weight:700; margin-bottom:8px;">AFTER REPAIR</div>
                <label style="border:1px dashed var(--line); height:80px; border-radius:6px; display:flex; justify-content:center; align-items:center; color:var(--ink-dim); font-size:12px; cursor:pointer; background:${data.afterPhotoUrl ? 'url('+data.afterPhotoUrl+') center/cover' : '#fff'};">
                  ${data.afterPhotoUrl ? '' : '+ Upload Photo'}
                  <input type="file" style="display:none;" onchange="uploadPhoto(this, 'after', '${docSnap.id}')" accept="image/*">
                </label>
              </div>
            </div>
          </div>
        `;
        jobList.innerHTML += jobHTML;
      });
      
      document.getElementById('statJobsDone').textContent = doneCount;
      document.getElementById('statActiveJobs').textContent = activeCount;
      
    } catch (e) {
      console.error("Error loading jobs:", e);
      jobList.innerHTML = '<div style="text-align:center; padding:20px; color:red;">Failed to load jobs.</div>';
    }
  }

  // Make update status function available globally
  window.updateJobStatus = async function(selectEl) {
    const newStatus = selectEl.value;
    const jobId = selectEl.getAttribute('data-id');
    try {
      await updateDoc(doc(db, "orders", jobId), { status: newStatus });
      
      // Update badge color instantly
      if(newStatus === 'done' || newStatus === 'ready') {
         selectEl.style.background = 'var(--leaf-dim)';
         selectEl.style.color = '#1F7A44';
      } else {
         selectEl.style.background = 'var(--marigold-dim)';
         selectEl.style.color = '#8A5C00';
      }
    } catch(e) {
      console.error("Failed to update status:", e);
      showToast("Failed to update job status.", 'error');
    }
  }

  window.uploadPhoto = async function(inputEl, type, jobId) {
    if (!inputEl.files || inputEl.files.length === 0) return;
    const file = inputEl.files[0];
    const labelEl = inputEl.parentElement;
    labelEl.innerHTML = 'Uploading...';
    
    try {
      const ext = file.name.split('.').pop();
      const storageRef = ref(storage, `orders/${jobId}/${type}_photo_${Date.now()}.${ext}`);
      await uploadBytes(storageRef, file);
      const downloadUrl = await getDownloadURL(storageRef);
      
      const updateData = {};
      updateData[`${type}PhotoUrl`] = downloadUrl;
      await updateDoc(doc(db, "orders", jobId), updateData);
      
      // Update UI
      labelEl.innerHTML = '';
      labelEl.style.background = `url(${downloadUrl}) center/cover`;
      labelEl.style.border = 'none';
      showToast(`${type.toUpperCase()} photo uploaded successfully!`);
    } catch(e) {
      console.error("Photo upload failed:", e);
      showToast("Failed to upload photo. Please try again.", 'error');
      labelEl.innerHTML = '+ Upload Photo';
    }
  }
</script>

<!-- Return to Home Draggable Button -->
<a href="index.html" class="return-home-btn" id="returnHomeBtn" style="position:fixed; bottom:100px; left:30px; z-index:9999; display:flex; align-items:center; gap:8px; background:var(--ink, #1F1B13); color:#fff; padding:12px 20px; border-radius:99px; text-decoration:none; font-weight:700; font-family:'Manrope', sans-serif; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,0.15); cursor:grab; user-select:none; transition: transform 0.3s, box-shadow 0.3s;">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  <span>Return to Home</span>
</a>
<script>
  (function(){
    const btn = document.getElementById('returnHomeBtn');
    if(!btn) return;
    let isDragging = false, hasDragged = false, offsetX, offsetY;

    const dragStart = (e) => {
      isDragging = true;
      hasDragged = false;
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      offsetX = clientX - btn.getBoundingClientRect().left;
      offsetY = clientY - btn.getBoundingClientRect().top;
      btn.style.cursor = 'grabbing';
      btn.style.transition = 'none';
    };

    const drag = (e) => {
      if (!isDragging) return;
      hasDragged = true;
      const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
      const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
      btn.style.left = (clientX - offsetX) + 'px';
      btn.style.top = (clientY - offsetY) + 'px';
      btn.style.bottom = 'auto';
      btn.style.right = 'auto';
    };

    const dragEnd = (e) => {
      if (!isDragging) return;
      isDragging = false;
      btn.style.cursor = 'grab';
      btn.style.transition = 'transform 0.3s, box-shadow 0.3s';
    };

    btn.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);
    btn.addEventListener('click', (e) => { if(hasDragged) e.preventDefault(); });
    btn.addEventListener('touchstart', dragStart, {passive: true});
    document.addEventListener('touchmove', drag, {passive: false});
    document.addEventListener('touchend', dragEnd);
  })();
</script>
