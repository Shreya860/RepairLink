<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — RepairLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
  .container { max-width: 1000px; width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 40px; box-shadow: 0 20px 50px rgba(34,29,20,0.12); margin-top: 20px; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; margin-bottom: 24px; color: var(--ink); }
  
  .data-section { margin-bottom: 40px; }
  .data-section h2 { font-family: 'Fraunces', serif; font-size: 20px; margin-bottom: 16px; color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--ink-dim); letter-spacing: 0.05em; }
  tr:hover { background: var(--paper-2); }
  
  .badge { padding: 4px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .badge.admin { background: var(--marigold-dim); color: #8A5C00; }
  .badge.user { background: #E3F2FD; color: #1565C0; }
  .badge.kaarigar { background: var(--leaf-dim); color: #1F7A44; }
  
  .nav-header { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .nav-header a { font-weight: 600; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
  .nav-header a:hover { color: var(--marigold); }
</style>
</head>
<body>

<div class="nav-header">
  <div style="font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700;">RepairLink<span style="color:var(--leaf)">.</span> Admin</div>
  <a href="RepairLink.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to Map</a>
</div>

<div class="container" id="adminContainer" style="display:none;">
  <h1>Admin Dashboard</h1>
  
  <div class="data-section">
    <h2>All Users</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Joined</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        <tr><td colspan="4" style="text-align:center; color:var(--ink-dim)">Loading...</td></tr>
      </tbody>
    </table>
  </div>
  
  <div class="data-section">
    <h2>All Kaarigars (Listings)</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Trade</th>
          <th>Area</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="kaarigarsTableBody">
        <tr><td colspan="4" style="text-align:center; color:var(--ink-dim)">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    projectId: "repairlink-de1ta",
    appId: "1:4711329582:web:6e12287963fd4bd58254bf",
    storageBucket: "repairlink-de1ta.firebasestorage.app",
    apiKey: "AIzaSyDMuvy1qfYvqLP348TZB-lfxGixaJGZFrk",
    authDomain: "repairlink-de1ta.firebaseapp.com",
    messagingSenderId: "4711329582",
    measurementId: "G-BQ7PBRSGH3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'Auth.html';
      return;
    }
    
    // Check role
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (userDoc.exists() && userDoc.data().role === 'admin') {
      document.getElementById('adminContainer').style.display = 'block';
      loadData();
    } else {
      alert("Access Denied. Admins only.");
      window.location.href = 'RepairLink.html';
    }
  });

  async function loadData() {
    const usersBody = document.getElementById('usersTableBody');
    const kaarigarsBody = document.getElementById('kaarigarsTableBody');
    
    // Load Users
    try {
      const usersSnap = await getDocs(collection(db, 'users'));
      usersBody.innerHTML = '';
      usersSnap.forEach(d => {
        const u = d.data();
        const dateStr = u.createdAt ? new Date(u.createdAt.seconds * 1000).toLocaleDateString() : 'Unknown';
        usersBody.innerHTML += `
          <tr>
            <td style="font-weight:600">${u.displayName || 'No Name'}</td>
            <td>${u.email}</td>
            <td><span class="badge ${u.role}">${u.role}</span></td>
            <td>${dateStr}</td>
          </tr>
        `;
      });
    } catch(err) {
      usersBody.innerHTML = `<tr><td colspan="4">Error loading users: ${err.message}</td></tr>`;
    }
    
    // Load Kaarigars
    try {
      const kaarigarsSnap = await getDocs(collection(db, 'kaarigars'));
      kaarigarsBody.innerHTML = '';
      kaarigarsSnap.forEach(d => {
        const k = d.data();
        const id = d.id;
        
        let actionHtml = '';
        if (k.verified) {
          actionHtml = `<span style="color:var(--leaf); font-weight:700;">Verified</span>`;
        } else {
          actionHtml = `<button onclick="approveKaarigar('${id}')" style="background:var(--marigold); color:#2A1E00; border:none; padding:4px 8px; border-radius:6px; cursor:pointer; font-weight:700; font-family:'Manrope', sans-serif;">Approve</button>`;
        }
        
        kaarigarsBody.innerHTML += `
          <tr>
            <td style="font-weight:600">${k.name || 'Unknown'}</td>
            <td>${k.trade || 'N/A'}</td>
            <td>${k.area || 'N/A'}</td>
            <td>${actionHtml}</td>
          </tr>
        `;
      });
    } catch(err) {
      kaarigarsBody.innerHTML = `<tr><td colspan="4">Error loading kaarigars: ${err.message}</td></tr>`;
    }
  }

  window.approveKaarigar = async function(id) {
    try {
      const { updateDoc } = await import("https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js");
      await updateDoc(doc(db, 'kaarigars', id), {
        verified: true
      });
      loadData();
    } catch(err) {
      alert("Error approving kaarigar: " + err.message);
    }
  }
</script>
</body>
</html>
